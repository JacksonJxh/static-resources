
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人项目静态素材</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.6 sans-serif;background:#f5f7fa;color:#4a5568;}
html, body {
height:100%;
}
/*顶部导航栏*/
.h{background:#fff;border-bottom:1px solid #e2e8f0;padding:16px 0}
.w{max-width:640px;margin:0 auto;padding:0 16px}
.l{font-size:18px;font-weight:700;color:#3182ce}
/* 主体使用flex纵向布局，实现：主内容占弹性空间，三张卡片紧贴页脚上方 */
.page-wrap {
min-height: calc(100vh - 72px); /*减去顶部导航高度*/
display:flex;
flex-direction:column;
padding:40px 0 20px 0;
}
.m{
flex:1 0 auto; /* 主卡片区域弹性占满剩余空间，把三张卡片往下压 */
}
/*主白色卡片*/
.b{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:28px 24px;margin-bottom:30px}
/*卡片顶部居中大标题*/
.card-main-title{
text-align:center;
font-size:20px;
font-weight:bold;
color:#222;
margin-bottom:10px;
}
/*标题下灰色说明文本，居中，浅灰色*/
.card-desc{
text-align:center;
font-size:13px;
color:#949ba8;
margin-bottom:24px;
line-height:1.5;
}
/*根目录资源标题，居左*/
.root-list-title{
font-size:18px;
font-weight:bold;
color:#222;
margin-bottom:16px;
}
.root-list{text-align:left}
.root-list ul{list-style:none}
.root-list li{margin:8px 0;font-size:15px}
.root-list a{color:#3182ce;text-decoration:none}
.root-list a:hover{text-decoration:underline}
/*底部3个卡片，紧贴页脚上方*/
.f{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:12px;
margin-top:auto; /* 关键：自动推到容器底部，页脚之上 */
margin-bottom:40px;
}
.i{
background:#ffffff;
border:1px solid #e8ebf0;
border-radius:6px;
padding:14px 8px;
text-align:center;
}
.i h3{
font-size:14px;
margin-bottom:4px;
color:#2d3748;
font-weight:normal;
}
.i p{font-size:12px;color:#6b7280;}
/*深色页脚原样保留*/
.ft{background:#1a202c;color:#a0aec0;padding:24px 0;text-align:center;font-size:12px}
.ft a{color:#63b3ed;text-decoration:none}
.ft .c{margin-top:8px;color:#a0aec0}
</style>
</head>
<body>
<div class="h"><div class="w"><div class="l">个人项目静态素材</div></div></div>
<div class="page-wrap w">
<div class="m">
<div class="b">
<!--卡片顶部居中标题-->
<div class="card-main-title">项目素材存储</div>
<!--灰色说明文字，居中-->
<div class="card-desc">存放本人项目、文档、博客所使用图片与附件，仅供本人内部引用，不对外提供托管服务</div>
<!--居左：根目录资源标题+CI文件列表-->
<div class="root-list-title">📁 根目录资源</div>
<div class="root-list">
<ul>
<!-- ROOT_DIR_ITEMS -->
</ul>
</div>
</div>
</div>
<!--三张卡片：margin-top:auto，会被压到页面底部、页脚上方，不受主卡片高度影响-->
<div class="f">
<div class="i">
<h3>目录式组织</h3>
<p>按文件夹分类管理素材</p>
</div>
<div class="i">
<h3>自定义域名访问</h3>
<p>基于GitHub Pages部署</p>
</div>
<div class="i">
<h3>自用用途</h3>
<p>仅用于个人项目内容引用</p>
</div>
</div>
</div>
<div class="ft">
<div class="w">

<div class="c">© 2026 个人项目素材库 · 仅供本人内部使用</div>
</div>
</div>
</body>
</html>
